name: Build & Release Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (TV, Mobile, Foldable, Tablet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepflix-android-universal
          path: build/app/outputs/flutter-apk/app-release.apk

  create-release:
    name: Publish GitHub Release with Downloads
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: deepflix-android-universal
          path: release-assets/

      - name: Rename File for Friendly Download
        run: |
          mv release-assets/app-release.apk release-assets/DEEPFLIX-Android-TV-Mobile.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          files: |
            release-assets/DEEPFLIX-Android-TV-Mobile.apk
          name: ${{ github.ref_type == 'tag' && format('DEEPFLIX Release {0}', github.ref_name) || 'DEEPFLIX Release (Latest)' }}
          body: |
            ### 🍿 DEEPFLIX - Aplicativo Oficial para Download

            - **Android (TV Box, Android TV, Celulares, Tablets e Dobráveis):** Baixe `DEEPFLIX-Android-TV-Mobile.apk`
            - **iOS (iPhone / iPad) e Web:** Acesse direto [https://deepflix.deepflix-app.workers.dev](https://deepflix.deepflix-app.workers.dev)

            *100% Gratuito, Sem fins lucrativos, Sem anúncios intrusivos.*
