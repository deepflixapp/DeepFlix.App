name: Web Worker checks
on:
  push:
    paths: ['worker/**', 'web/**', 'test-web/**', 'package*.json', 'wrangler.toml', '.github/workflows/web-check.yml']
  pull_request:
    paths: ['worker/**', 'web/**', 'test-web/**', 'package*.json', 'wrangler.toml', '.github/workflows/web-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
