name = "deepflix"
account_id = "000efa89df7e610d65b2ad2d456d5431"
main = "worker/index.mjs"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/sitemap.xml", "/sitemaps/*", "/playlist.m3u", "/playlist.m3u8", "/canais.m3u", "/canais.m3u8"]

[[d1_databases]]
binding = "DB"
database_name = "deepflix"
database_id = "aab10671-ef95-4602-8754-600c9d4b3299"

[env.preview]
name = "deepflix-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "deepflix-preview"
database_id = "4be1c12a-03d1-47f2-a4d2-e87eddda4469"
