name = "deepflix"
main = "worker/index.mjs"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/sitemap.xml", "/playlist.m3u", "/playlist.m3u8", "/canais.m3u", "/canais.m3u8"]

[[d1_databases]]
binding = "DB"
database_name = "deepflix"
database_id = "00000000-0000-0000-0000-000000000000"

[env.preview]
name = "deepflix-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "deepflix-preview"
database_id = "00000000-0000-0000-0000-000000000000"
