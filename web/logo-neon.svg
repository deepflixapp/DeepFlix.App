  </defs>
  <style>
    .brand-neon-text {
      font-family: -apple-system, BlinkMacSystemFont, "Montserrat", "Inter", "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 26px;
      letter-spacing: 1.8px;
      user-select: none;
    }
  </style>
  <g class="brand-neon-text" filter="url(#neonFullGlow)">
    <text x="2" y="26" fill="url(#neonPurpleGrad)">DEEPFLIX</text>
  </g>
