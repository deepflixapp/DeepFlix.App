<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 34" width="170" height="34" fill="none" aria-label="DEEPFLIX">
  <defs>
    <linearGradient id="neonPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="25%" stop-color="#E9D5FF"/>
      <stop offset="60%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
