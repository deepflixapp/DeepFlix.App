name: deepflix_app
description: "DEEPFLIX - Streaming & Live TV standalone app for Android TV, Mobile, and Tablet"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  xml: ^6.5.0
  shared_preferences: ^2.2.2
  video_player: ^2.8.2
  chewie: ^1.7.4
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.8
  media_kit_libs_linux_video: ^1.0.8
  media_kit_libs_macos_video: ^1.0.8
  cached_network_image: ^3.3.1
  flutter_cast_framework: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
