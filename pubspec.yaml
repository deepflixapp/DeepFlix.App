name: deepflix_app
description: "DEEPFLIX - Streaming & Live TV standalone app for Android TV, Mobile, and Tablet"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  xml: ^6.5.0
  shared_preferences: ^2.3.2
  video_player: ^2.9.1
  chewie: ^1.8.5
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
